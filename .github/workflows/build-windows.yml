name: Build Windows Application
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm install

      - name: Install and Prepare LibreOffice
        shell: pwsh
        run: |
          choco install libreoffice-still -y --no-progress
          $targetDir = "src-tauri/resources/libreoffice"
          if (!(Test-Path $targetDir)) { New-Item -ItemType Directory -Force -Path $targetDir }
          $librePath = "C:\Program Files\LibreOffice"
          Write-Host "Copying LibreOffice from $librePath to $targetDir ..."
          Copy-Item -Path "$librePath\*" -Destination $targetDir -Recurse -Force

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: run-${{ github.run_id }}
          releaseName: 'App Windows Build (${{ github.run_id }})'
          releaseBody: 'See the attached assets to download the built Windows .exe file.'
          releaseDraft: false
          prerelease: false
          args: '--target x86_64-pc-windows-msvc'
