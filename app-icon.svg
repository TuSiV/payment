<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Beautiful Deep Ocean to Violet -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/> <!-- Deep Slate -->
      <stop offset="0.5" stop-color="#312E81"/> <!-- Indigo -->
      <stop offset="1" stop-color="#4C1D95"/> <!-- Violet -->
    </linearGradient>

    <!-- Document Body Gradient -->
    <linearGradient id="docGrad" x1="200" y1="150" x2="800" y2="850" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Folder/Envelope Front -->
    <linearGradient id="folderFront" x1="150" y1="500" x2="874" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Folder/Envelope Back -->
    <linearGradient id="folderBack" x1="150" y1="350" x2="874" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Golden Magic Accent -->
    <linearGradient id="gold" x1="600" y1="600" x2="850" y2="850" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDE047"/>
      <stop offset="0.5" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#B45309"/>
    </linearGradient>

    <!-- Shadows and Glows -->
    <filter id="heavyShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="30" stdDeviation="25" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="magicGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Squircle Background -->
  <rect x="52" y="52" width="920" height="920" rx="210" fill="url(#bgGrad)"/>
  
  <!-- 2. Envelope Back -->
  <path d="M150 450 L512 600 L874 450 V800 C874 830 850 854 820 854 H204 C174 854 150 830 150 800 V450 Z" fill="url(#folderBack)" filter="url(#softShadow)"/>

  <!-- 3. The Document (Generated Letter) sliding out -->
  <path d="M220 200 C220 180 240 160 260 160 H600 L760 320 V650 C760 650 512 730 512 730 C512 730 220 620 220 620 V200 Z" fill="url(#docGrad)" filter="url(#heavyShadow)"/>
  
  <!-- Document Folded Corner -->
  <path d="M600 160 V280 C600 300 620 320 640 320 H760 Z" fill="#CBD5E1"/>

  <!-- Detailed Document Content (Rich Layout) -->
  <!-- Header / Company Logo area -->
  <rect x="300" y="260" width="80" height="80" rx="20" fill="#3B82F6"/>
  <rect x="420" y="270" width="220" height="24" rx="12" fill="#94A3B8"/>
  <rect x="420" y="310" width="160" height="20" rx="10" fill="#CBD5E1"/>
  
  <!-- Excel Data Table Area (Representing the Generation logic) -->
  <rect x="300" y="400" width="120" height="30" rx="8" fill="#10B981"/>
  <rect x="440" y="400" width="120" height="30" rx="8" fill="#8B5CF6"/>
  <rect x="580" y="400" width="80" height="30" rx="8" fill="#F59E0B"/>
  
  <rect x="300" y="450" width="360" height="15" rx="7" fill="#94A3B8"/>
  <rect x="300" y="490" width="300" height="15" rx="7" fill="#CBD5E1"/>
  <rect x="300" y="530" width="280" height="15" rx="7" fill="#CBD5E1"/>

  <!-- 4. Envelope Front Flap -->
  <path d="M150 450 L512 680 L874 450 V800 C874 830 850 854 820 854 H204 C174 854 150 830 150 800 V450 Z" fill="url(#folderFront)" filter="url(#heavyShadow)"/>

  <!-- Top Envelope Flap curling down (Glassmorphism look) -->
  <path d="M150 450 L512 720 L874 450 L512 300 Z" fill="#60A5FA" fill-opacity="0.3" filter="url(#softShadow)"/>

  <!-- 5. 3D Magical Gear & Sparkles (Representing Factory/Generator) -->
  <g transform="translate(680, 580) rotate(20)" filter="url(#heavyShadow)">
    <circle cx="100" cy="100" r="70" fill="url(#gold)" stroke="#FFFFFF" stroke-width="6"/>
    <!-- Inner circle -->
    <circle cx="100" cy="100" r="30" fill="#F8FAFC"/>
    <!-- Gear teeth -->
    <rect x="85" y="10" width="30" height="180" rx="10" fill="url(#gold)"/>
    <rect x="10" y="85" width="180" height="30" rx="10" fill="url(#gold)"/>
    <rect x="40" y="40" width="120" height="120" rx="10" fill="url(#gold)" transform="rotate(45, 100, 100)"/>
  </g>

  <!-- 6. Glowing Magical Stars / Sparkles -->
  <path d="M250 120 L260 160 L300 170 L260 180 L250 220 L240 180 L200 170 L240 160 Z" fill="#67E8F9" filter="url(#magicGlow)"/>
  <path d="M800 200 L815 250 L865 265 L815 280 L800 330 L785 280 L735 265 L785 250 Z" fill="#FDE047" filter="url(#magicGlow)"/>
  <path d="M850 480 L855 500 L875 505 L855 510 L850 530 L845 510 L825 505 L845 500 Z" fill="#A78BFA" filter="url(#magicGlow)"/>
  <circle cx="650" cy="200" r="10" fill="#FEF08A" filter="url(#magicGlow)"/>
</svg>
